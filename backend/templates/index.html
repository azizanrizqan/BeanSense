<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>BeanSense AI</title>

    <style>

        body{
            font-family: Arial;
            background: #f4f4f4;
            text-align: center;
            padding-top: 50px;
        }

        .container{
            background: white;
            width: 400px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.2);
        }

        h1{
            color: #5c4033;
        }

        button{
            padding: 10px 20px;
            background: #5c4033;
            color: white;
            border: none;
            border-radius: 5px;
        }

        img{
            width: 200px;
            margin-top: 20px;
        }

    </style>
</head>

<body>

    <div class="container">

        <h1>☕ BeanSense AI</h1>

        <form
            action="/predict"
            method="POST"
            enctype="multipart/form-data"
        >

            <input
                type="file"
                name="image"
                required
            >

            <br><br>

            <button type="submit">
                Predict Coffee
            </button>

        </form>

        {% if prediction %}

            <h2>
                Hasil Prediksi:
            </h2>

            <h1>
                {{ prediction }}
            </h1>

            <img
                src="{{ url_for('static', filename='../uploads/' + image) }}"
            >

        {% endif %}

    </div>

</body>
</html>
