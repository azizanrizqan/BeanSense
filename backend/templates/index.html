<!DOCTYPE html>
<html>

<head>

    <title>
        BeanSense AI
    </title>

    <style>

        body{
            font-family: Arial;
            background: #f4f4f4;
            text-align: center;
            padding-top: 50px;
        }

        .container{
            width: 450px;
            background: white;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0px 0px 15px rgba(0,0,0,0.2);
        }

        h1{
            color: brown;
        }

        button{
            padding: 10px 20px;
            background: brown;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover{
            background: #5c1d1d;
        }

        img{
            width: 250px;
            margin-top: 20px;
            border-radius: 10px;
        }

        .result{
            margin-top: 20px;
            padding: 15px;
            background: #f7f7f7;
            border-radius: 10px;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>
            ☕ BeanSense AI
        </h1>

        <p>
            Coffee Bean Classification
        </p>

        <form
            action="/predict"
            method="POST"
            enctype="multipart/form-data"
        >

            <input
                type="file"
                name="image"
                required
            >

            <br><br>

            <button type="submit">
                Predict Coffee
            </button>

        </form>

        {% if prediction %}

            <div class="result">

                <h2>
                    Hasil Prediksi
                </h2>

                <h1>
                    {{ prediction }}
                </h1>

                <h3>
                    Confidence :
                    {{ confidence }}%
                </h3>

                <img
                    src="{{ url_for('static', filename=image) }}"
                >

            </div>

        {% endif %}

    </div>

</body>
</html>
